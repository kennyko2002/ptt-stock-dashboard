<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTT Stock 情緒儀表板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
  // CDN fallback：jsdelivr 載入失敗時改用 unpkg
  window.addEventListener('load', function () {
    if (typeof echarts === 'undefined') {
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/echarts@5.5.0/dist/echarts.min.js';
      s.onload = function () { location.reload(); };
      document.head.appendChild(s);
    }
  });
</script>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2130; --border: #2a3448;
    --text: #e8edf5; --muted: #8b98ad; --accent: #4f8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text); padding: 20px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; gap: 16px; }
  .grid-today { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px;
    overflow: hidden;  /* 防止 ECharts canvas 溢出 panel 疊到別格 */
    position: relative;
  }
  .panel h2 { font-size: 15px; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
  .gauge { width: 100%; height: 200px; }
  .gauge-main { height: 240px; }
  .stats { display: flex; gap: 24px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat { font-size: 13px; color: var(--muted); }
  .stat b { color: var(--text); font-size: 20px; margin-left: 6px; }
  .chart { width: 100%; height: 420px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  select, button {
    background: #232c3f; color: var(--text); border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  select:hover, button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  #updatedAt { color: var(--muted); font-size: 12px; margin-left: auto; }
</style>
</head>
<body>
  <h1>📊 PTT Stock 情緒儀表板</h1>
  <div class="subtitle">盤後閒聊推文情緒分析 × 大盤指數對照</div>

  <div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">
    <span>🎨 配色說明：</span>
    <span><span style="color:#27ae60;font-weight:bold;">●</span> 綠 = 樂觀/正向（看多、貪婪高 → 好）</span>
    <span><span style="color:#e74c3c;font-weight:bold;">●</span> 紅 = 恐慌/負向（恐慌、絕望高 → 壞）</span>
    <span><span style="color:#f39c12;font-weight:bold;">●</span> 黃 = 中性區</span>
    <span><span style="color:#4f8cff;font-weight:bold;">●</span> 藍 = 中性指標（FOMO、反串僅顯示強度，無好壞）</span>
  </div>

  <div class="stats">
    <div class="stat">資料日期 <b id="statDate">-</b></div>
    <div class="stat">總留言 <b id="statCount">-</b></div>
    <div class="stat">有效情緒 <b id="statValid">-</b></div>
    <div class="stat">極端分數 <b id="statExtreme">-</b></div>
    <div class="stat">資料來源 <b id="statSource" style="font-size:13px;">MongoDB</b></div>
    <div id="statNote" style="color:#f39c12;font-size:12px;align-self:center;"></div>
    <div id="updatedAt"></div>
  </div>

  <div class="panel" style="margin-bottom:16px;">
    <h2>今日綜合指標（Emotion Index）<span id="eiState" style="margin-left:10px;font-size:14px;font-weight:700;"></span></h2>
    <div id="gaugeMain" class="gauge gauge-main"></div>
  </div>

  <div class="grid grid-today" id="gaugeGrid"></div>

  <div class="panel" style="margin-top:16px;">
    <h2>歷史指標 × 大盤指數（TAIEX）</h2>
    <div class="toolbar">
      <label style="color:var(--muted);font-size:13px;">情緒指標：</label>
      <select id="metricSelect">
        <option value="emotion_index">綜合指數 (Emotion Index)</option>
        <option value="fomo">FOMO 害怕錯過</option>
        <option value="fear">恐慌</option>
        <option value="greed">貪婪</option>
        <option value="despair">絕望</option>
        <option value="bullish">看多</option>
        <option value="bearish">看空</option>
        <option value="sarcasm">反串/諷刺</option>
      </select>
      <button class="primary" onclick="loadAll()">🔄 重新整理</button>
    </div>
    <div id="historyChart" class="chart"></div>
  </div>

<script>
let gaugeMain = null;
let historyChart = null;
let gaugeCharts = [];
let todayData = null;
let historyData = [];

// 延遲到頁面完全載入（含 ECharts CDN）後初始化圖表，避免容器尺寸未定導致圖形擠壓
window.addEventListener('load', () => {
  if (typeof echarts === 'undefined') {
    document.querySelectorAll('.gauge, .chart').forEach(el => {
      el.innerHTML = '<div class="empty">ECharts 載入失敗（CDN 無法訪問）</div>';
    });
    return;
  }
  gaugeMain = echarts.init(document.getElementById('gaugeMain'));
  historyChart = echarts.init(document.getElementById('historyChart'));
  loadAll();
  setInterval(loadAll, 60000);
  window.addEventListener('resize', () => {
    if (gaugeMain) gaugeMain.resize();
    if (historyChart) historyChart.resize();
    gaugeCharts.forEach(g => g.resize());
  });
});

// 指標方向：positive=越高越好(綠高) / negative=越高越壞(紅高) / neutral=中性(藍) / index=綜合(紅黃綠)
const METRIC_DIR = {
  emotion_index: 'index',
  bullish: 'positive', greed: 'positive',
  fear: 'negative', despair: 'negative', bearish: 'negative',
  fomo: 'neutral', sarcasm: 'neutral'
};

function fmt(v, digits = 1) {
  if (v === null || v === undefined || isNaN(v)) return '-';
  return Number(v).toFixed(digits);
}

function gaugeOption(value, label, max = 100, dir = 'neutral') {
  // 依方向決定漸層：0% → 100%
  let axisColor, progressColor;
  if (dir === 'positive') {       // 低=壞(紅) 高=好(綠)
    axisColor = [[0.35, '#e74c3c'], [0.6, '#f39c12'], [1, '#27ae60']];
    progressColor = value > 60 ? '#27ae60' : value > 40 ? '#f39c12' : '#e74c3c';
  } else if (dir === 'negative') { // 低=好(綠) 高=壞(紅) — 反向
    axisColor = [[0.35, '#27ae60'], [0.6, '#f39c12'], [1, '#e74c3c']];
    progressColor = value > 60 ? '#e74c3c' : value > 40 ? '#f39c12' : '#27ae60';
  } else if (dir === 'index') {   // 綜合指數：低=恐慌(紅) 中=中性(黃) 高=樂觀(綠)
    axisColor = [[0.4, '#e74c3c'], [0.6, '#f39c12'], [1, '#27ae60']];
    progressColor = value > 55 ? '#27ae60' : value < 45 ? '#e74c3c' : '#f39c12';
  } else {                        // 中性：藍色漸層，僅顯示強度
    axisColor = [[0.5, '#3d7bf5'], [1, '#8fb3ff']];
    progressColor = '#4f8cff';
  }
  return {
    series: [{
      type: 'gauge', min: 0, max, value,
      startAngle: 210, endAngle: -30,
      progress: { show: true, width: 12, itemStyle: { color: progressColor } },
      axisLine: { lineStyle: { width: 12, color: axisColor } },
      // 指針：指向目前數值，明確顯示落在哪個顏色區間
      pointer: { show: true, length: '50%', width: 5, itemStyle: { color: progressColor } },
      anchor: { show: true, size: 9, itemStyle: { color: progressColor, borderColor: '#0f1420', borderWidth: 2 } },
      // 外圍刻度不顯示（使用者要求，避免干擾）
      axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false },
      // 文字放底部，避免被指針擋到（title 在 detail 下方，保持間距）
      title: { show: true, offsetCenter: [0, '82%'], fontSize: 13, color: '#8b98ad' },
      detail: {
        valueAnimation: true, fontSize: 22, fontWeight: 'bold',
        formatter: v => fmt(v),
        offsetCenter: [0, '62%'], color: '#e8edf5'
      },
      data: [{ value, name: label }]
    }]
  };
}

function emotionStateText(v) {
  if (v === null || v === undefined) return '';
  if (v > 60) return '🟢 樂觀';
  if (v > 55) return '🟢 偏樂觀';
  if (v >= 45) return '🟡 中性';
  if (v >= 40) return '🔴 偏恐慌';
  return '🔴 恐慌';
}

function buildTodayGauges(data) {
  // 今日日期/統計
  document.getElementById('statDate').textContent = data.date || '-';
  document.getElementById('statCount').textContent = data.comment_count ?? '-';
  document.getElementById('statValid').textContent = data.valid_comment_count ?? '-';
  document.getElementById('statExtreme').textContent = fmt(data.extreme_score, 3);
  const notes = [data.display_note, data.percentile_note].filter(Boolean).join(' ');
  document.getElementById('statNote').textContent = notes;

  // 綜合指標大儀表
  const ei = data.emotion_index ?? null;
  const stateText = emotionStateText(ei);
  document.getElementById('eiState').textContent = stateText;
  if (ei !== null) {
    gaugeMain.setOption(gaugeOption(ei, '綜合指數', 100, 'index'));
  } else {
    gaugeMain.clear();
  }

  // 各指標儀表網格
  const grid = document.getElementById('gaugeGrid');
  grid.innerHTML = '';
  gaugeCharts.forEach(g => g.dispose());
  gaugeCharts = [];

  const metrics = data.metrics || {};
  const entries = Object.entries(metrics);
  if (!entries.length) {
    grid.innerHTML = '<div class="empty">尚無指標資料</div>';
    return;
  }

  for (const [key, m] of entries) {
    const div = document.createElement('div');
    div.className = 'panel';
    div.innerHTML = `<div id="g-${key}" class="gauge"></div>`;
    grid.appendChild(div);
    const chart = echarts.init(document.getElementById(`g-${key}`));
    // 有歷史百分位時顯示百分位（0-100，該指標在歷史中的相對位置），否則顯示原始加權值 ×100
    const hasPct = m.percentile !== null && m.percentile !== undefined;
    const rawVal = (m.weighted ?? m.mean ?? 0) * 100;
    const val = hasPct ? m.percentile : rawVal;
    const label = hasPct ? m.label + ' 百分位' : m.label;
    chart.setOption(gaugeOption(val, label, 100, METRIC_DIR[key] || 'neutral'));
    // 關鍵：容器剛插入 DOM 時寬度可能尚未計算（會得到 0/異常），
    // 等下一幀佈局完成後強制 resize，確保 canvas 不溢出 panel
    requestAnimationFrame(() => requestAnimationFrame(() => chart.resize()));
    gaugeCharts.push(chart);
  }
}

function buildHistoryChart(metric) {
  if (!historyData.length) {
    historyChart.clear();
    historyChart.setOption({
      title: { text: '尚無歷史資料', left: 'center', textStyle: { color: '#8b98ad', fontSize: 14 } }
    });
    return;
  }

  const dates = historyData.map(d => d.date);
  const sentimentVals = historyData.map(d => {
    let v = d[metric];
    if (metric !== 'emotion_index') v = (v ?? 0) * 100; // 0-1 → 0-100
    return v;
  });
  const taiexVals = historyData.map(d => d.taiex_close);
  const hasTaiex = taiexVals.some(v => v !== null && v !== undefined);

  const metricLabel = document.getElementById('metricSelect')
    .selectedOptions[0].textContent.split(' ')[0];

  // 指標線顏色依方向：positive=綠 / negative=紅 / index=藍紫 / neutral=藍
  const dir = METRIC_DIR[metric] || 'neutral';
  const lineColor = dir === 'positive' ? '#27ae60' : dir === 'negative' ? '#e74c3c' : '#4f8cff';

  historyChart.setOption({
    tooltip: {
      trigger: 'axis',
      formatter: params => {
        let s = `<b>${params[0].axisValue}</b><br/>`;
        params.forEach(p => {
          const v = p.seriesName === 'TAIEX 收盤' ? fmt(p.value, 0) : fmt(p.value, 2);
          s += `${p.marker} ${p.seriesName}: ${v}<br/>`;
        });
        return s;
      }
    },
    legend: { data: [metricLabel, 'TAIEX 收盤'], textStyle: { color: '#8b98ad' }, top: 0 },
    grid: { left: 55, right: 70, top: 35, bottom: 40 },
    xAxis: {
      type: 'category', data: dates, boundaryGap: false,
      axisLine: { lineStyle: { color: '#2a3448' } },
      axisLabel: { color: '#8b98ad' }
    },
    yAxis: [
      {
        type: 'value', name: metricLabel,
        min: 0, max: 100,
        axisLine: { lineStyle: { color: '#2a3448' } },
        splitLine: { lineStyle: { color: '#232c3f' } },
        axisLabel: { color: '#8b98ad' }
      },
      {
        type: 'value', name: 'TAIEX', position: 'right',
        axisLine: { lineStyle: { color: '#2a3448' } },
        splitLine: { show: false },
        axisLabel: { color: '#8b98ad', formatter: v => fmt(v, 0) }
      }
    ],
    series: [
      {
        name: metricLabel, type: 'line', data: sentimentVals, smooth: true,
        lineStyle: { width: 3, color: lineColor },
        itemStyle: { color: lineColor },
        areaStyle: { color: hexToRgba(lineColor, 0.12) },
        markLine: metric === 'emotion_index' ? {
          silent: true, symbol: 'none',
          lineStyle: { type: 'dashed', color: '#8b98ad' },
          label: { color: '#8b98ad', formatter: '中性 50', position: 'insideEndTop' },
          data: [{ yAxis: 50 }]
        } : undefined
      },
      {
        name: 'TAIEX 收盤', type: 'line', data: taiexVals, smooth: true,
        yAxisIndex: 1,
        lineStyle: { width: 2, color: '#e67e22' },
        itemStyle: { color: '#e67e22' },
        showSymbol: false
      }
    ]
  });
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

async function loadAll() {
  // 靜態模式：若同目錄有 data.json（靜態托管用），優先載入；否則走 API（本機模式）
  let t, h;
  try {
    const staticResp = await fetch('data.json', { cache: 'no-store' });
    if (staticResp.ok) {
      const staticData = await staticResp.json();
      t = staticData.today;
      h = staticData.history || [];
      document.getElementById('statSource').textContent = '靜態資料';
    } else {
      throw new Error('no static');
    }
  } catch (e) {
    const [tr, hr] = await Promise.all([
      fetch('/api/today').then(r => r.json()),
      fetch('/api/history').then(r => r.json())
    ]);
    t = tr; h = hr;
    document.getElementById('statSource').textContent = 'MongoDB';
  }
  todayData = t;
  historyData = h;
  buildTodayGauges(t);
  buildHistoryChart(document.getElementById('metricSelect').value);
  document.getElementById('updatedAt').textContent = '更新於 ' + new Date().toLocaleTimeString('zh-Hant');
}

document.getElementById('metricSelect').addEventListener('change', e => buildHistoryChart(e.target.value));
// 圖表初始化與 loadAll 已由 window load 事件統一觸發（見上方）
</script>
</body>
</html>
